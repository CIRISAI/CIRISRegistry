# CIRISRegistry Ansible Configuration
[defaults]
inventory = inventory/staging.yml
roles_path = roles
collections_paths = collections
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
callback_whitelist = timer, profile_tasks

# Timeout settings
timeout = 30
gather_timeout = 30

# SSH settings (if using bastion)
[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Plugin settings
[inventory]
enable_plugins = yaml, aws_ec2

# AWS collection configuration
[aws]
region = us-east-1
