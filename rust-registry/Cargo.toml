[package]
name = "ciris-registry"
version = "1.1.0"
edition = "2021"
rust-version = "1.84"
authors = ["CIRIS AI <hello@ciris.ai>"]
description = "Federation registry — agent + partner + license identity for the CIRIS stack."
license = "AGPL-3.0-or-later"
repository = "https://github.com/CIRISAI/CIRISRegistry"
readme = "../README.md"
publish = false

# Versioning rule: Registry MAJOR version bumps signal CEG wire-format
# conformance breaks. v1.x = FSD-002 v1.4.3 baseline; v2.x = CEG 0.2.
# See RELEASE.md for the release process + CHANGELOG.md for per-version
# notes. Sister packaging discipline matches ciris-persist / ciris-edge /
# ciris-lens-core / ciris-node-core / ciris-crypto (the substrate triple
# + the cohabit crates).

[dependencies]
# gRPC / Protocol Buffers
tonic = { version = "0.12", features = ["gzip", "tls"] }
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async Runtime
tokio = { version = "1.44", features = ["full"] }
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "time",
    "json"
]}

# Middleware / Tower
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "auth", "limit"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.2"

# Cryptography - Classical
ed25519-dalek = { version = "2.1", features = ["rand_core", "hazmat"] }
sha2 = "0.10"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }

# Cryptography - Hybrid (Ed25519 + ML-DSA-65 / FIPS 204)
# CIRISVerify v1.14.0 alignment: ciris-crypto provides Ed25519Signer + MlDsa65Signer
# (the same primitives CIRISLens, CIRISAgent, and CIRISPersist consume).
# v1.8.5 fixed ML-DSA-65 signature size to FIPS 204 final value (3309 bytes).
# Registry uses only Ed25519 + ML-DSA-65 signing/verifying — pqc-ml-dsa feature.
#
# Holding at v1.14.0 (not v2.0.x): the v2.0.2+ ciris-crypto pins
# `ml-dsa = "=0.1.0-rc.8"` which transitively pulls `pkcs8 ^0.11.0-rc.11`.
# Cargo's pre-release resolution rules mean the caret excludes rc.11
# itself, forcing pkcs8 0.11.0 stable — which is API-incompatible with
# ml-dsa rc.8 (Error::KeyMalformed signature changed). Upstream sidesteps
# this via a workspace Cargo.lock, but consumers can't inherit that.
# Bumping to v2.0.x requires a [patch.crates-io] pin on pkcs8 here, which
# is a separate followup. Closes CIRISRegistry#10 (lag eliminated; v2.0.x
# tracked separately).
ciris-crypto = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v1.14.0", features = ["pqc-ml-dsa"] }

# NOTE on BuildManifest validation:
# We do NOT pull ciris-verify-core. Reasons:
#   1. ciris-verify-core has a hard rusqlite dep (license cache) that
#      conflicts with sqlx-sqlite at the libsqlite3-sys linker level.
#   2. Most of ciris-verify-core (transparency log, license cache,
#      registry client, app_attest) is verifier-side and unused by the
#      registry.
#   3. The BuildManifest type is small (~80 lines) and stable enough to
#      vendor + maintain wire-format parity via integration tests.
# See `src/security/build_manifest.rs` for the vendored type. ciris-crypto
# (above) provides the actual signature verifiers we use.

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.15"
dotenvy = "0.15"

# Authentication
jsonwebtoken = "9.3"
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"  # For generating test certificates

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Health checks
axum = "0.8"  # For HTTP/REST gateway

# Compression for offline packages
flate2 = "1.0"
zstd = "0.13"

# Merkle tree
rs_merkle = "1.4"

# Base encoding
hex = "0.4"
base64 = "0.22"

# CBOR for App Attest
ciborium = "0.2"

# X.509 certificate parsing for App Attest
x509-cert = "0.2"
der = "0.7"
p256 = { version = "0.13", features = ["ecdsa"] }
ring = "0.17"

# HTTP client (used by Play Integrity verifier)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
tempfile = "3.15"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# Property-based testing (Rust equivalent of Hypothesis)
proptest = "1.5"
proptest-derive = "0.5"

# Test utilities
test-case = "3.3"      # Parameterized tests
fake = { version = "3.1", features = ["derive"] }  # Fake data generation
chrono = "0.4"         # Time utilities for tests
pretty_assertions = "1.4"  # Better assertion diffs

[[bin]]
name = "ciris-registry"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
