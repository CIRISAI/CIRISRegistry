[workspace]
resolver = "2"
members = [
    "ciris-registry-core",
    "ciris-registry",
]

# Workspace-level dependency declarations live in each member's Cargo.toml
# (rather than in [workspace.dependencies]) so we can keep the per-crate
# version pins explicit + readable. Cargo's resolver will unify shared deps
# across the workspace automatically.

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CIRISAI/CIRISRegistry"
# 1.86 is verify v16.1.0's floor (persist v48.0.0 is 1.83, edge v31.0.0 is 1.75);
# build with the highest of the three.
rust-version = "1.86"
authors = ["CIRIS AI <hello@ciris.ai>"]
# pkcs8 transitive-pin resolution lives in ciris-registry-core's
# [dependencies] (where ciris-crypto is consumed); see comment block there.

[profile.release]
lto = true
codegen-units = 1
strip = true
