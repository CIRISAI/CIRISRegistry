[package]
name = "ciris-registry-core"
version = "2.1.3"
edition = "2021"
rust-version = "1.84"
authors = ["CIRIS AI <hello@ciris.ai>"]
description = "Federation registry library — agent + partner + license identity surface for CIRISAgent cohabitation alongside ciris-lens-core + ciris-node-core."
license = "AGPL-3.0-or-later"
repository = "https://github.com/CIRISAI/CIRISRegistry"
readme = "../../README.md"
publish = false
# Library-only crate; bin lives at `../ciris-registry`. Disable bin
# auto-detection so Cargo doesn't expect a main.rs here.
autobins = false
autoexamples = false
autobenches = false

# Phase 4 of #33 — this crate IS the cohabit-target library that CIRISAgent
# will pull alongside ciris-lens-core + ciris-node-core post-fold. The bin
# entry point (ciris-registry) lives in the sibling crate at
# `../ciris-registry`. Both share the workspace version.
#
# Versioning rule: MAJOR version bumps signal CEG wire-format conformance
# breaks. v1.x = FSD-002 v1.4.3 baseline; v2.x = CEG 0.2.

[lib]
name = "ciris_registry_core"
path = "src/lib.rs"

[dependencies]
# gRPC / Protocol Buffers
tonic = { version = "0.12", features = ["gzip", "tls"] }
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async Runtime
tokio = { version = "1.44", features = ["full"] }
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "time",
    "json"
]}

# Middleware / Tower
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "auth", "limit"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.2"

# Cryptography - Classical
ed25519-dalek = { version = "2.1", features = ["rand_core", "hazmat"] }
sha2 = "0.10"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }

# =============================================================================
# Substrate triple (Phase 1 of #33 — CEG 0.2 conformance + fold-readiness)
# =============================================================================
# CIRISRegistry consumes the same three substrate components that CIRISLens
# Core, CIRISNodeCore, and (post-fold) CIRISAgent consume — keeping the
# cohabitation pin discipline consistent so all four cohabit crates resolve
# to the same substrate versions.
#
#   ciris-crypto   v4.0.0   (Verify; hybrid Ed25519 + ML-DSA-65)
#   ciris-persist  v3.3.0   (substrate storage; federation_keys + attestations)
#   ciris-edge     v0.18.0  (Reticulum-native federation transport)
#
# Phase-1 state: deps added, NOT YET WIRED. Vendored federation client in
# `src/federation/persist_client.rs` still returns NotYetImplemented; Edge
# transport client not yet implemented. See umbrella issue #33 for the
# Phase 2 + 3 wiring schedule.
#
# pkcs8 transitive-pin note: ciris-crypto v2.0.x → v4.0.0 inherited the
# `ml-dsa = "=0.1.0-rc.8"` → `pkcs8 ^0.11.0-rc.11` chain that previously
# blocked the v1.14.0 → v2.0.x bump (the comment that lived here pre-1.2
# documented this). The [patch.crates-io] block below resolves it.
# Originally tracked as CIRISRegistry#10; resolved this phase.

# Cohabit-set version matrix per [CIRISConformance/matrices/current.yaml]
# (https://github.com/CIRISAI/CIRISConformance/blob/main/matrices/current.yaml):
#   ciris-verify  v4.4.2  (carries ciris-crypto + ciris-keyring at the same tag)
#   ciris-persist v3.6.4  (multimedia tier #134 + trust_scoring_capsule #128/#129)
#   ciris-edge    v1.0.1  (CIRISEdge#50 durable-send SIGSEGV fix; 1.0 milestone)
#
# The cohabit set converged at keyring v4.x across all members so Cargo can
# unify the dep graph cleanly. The local `PersistPqcAdapter` stopgap from v1.3.0
# (CIRISVerify#39) is no longer needed — ciris-keyring v4.1.0+ ships
# `impl PqcSigner for MlDsa65Signer` upstream and the unified v4.4.2 across
# all our deps lets us use it directly.
ciris-crypto  = { git = "https://github.com/CIRISAI/CIRISVerify",  tag = "v4.4.3",   features = ["pqc-ml-dsa"] }
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify",  tag = "v4.4.3",   default-features = false, features = ["software", "pqc-ml-dsa"] }
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v3.6.9", features = ["postgres", "sqlite"] }
ciris-edge    = { git = "https://github.com/CIRISAI/CIRISEdge",    tag = "v1.1.3" }

# Force libsqlite3-sys to build with bundled libsqlite3 so the final
# binary statically links sqlite3 and does NOT require libsqlite3.so.0
# at runtime. v2.1.0 shipped a runtime stage that lacked libsqlite3-0
# (the apt-installed runtime lib), and ciris-persist v3.6.3+ pulls
# rusqlite v0.31.0 → libsqlite3-sys v0.28.0 which, by default, links
# system libsqlite3 dynamically. Result: production crash-loop with
# "error while loading shared libraries: libsqlite3.so.0".
#
# Adding libsqlite3-sys with `bundled` feature at the workspace level
# forces ALL transitive consumers (rusqlite, ciris-persist, ciris-edge,
# ciris-verify-core) to share a single bundled build. Cargo's feature-
# union semantics make this propagate without requiring per-crate
# Cargo.toml changes in our deps.
#
# Belt-and-suspenders: Dockerfile runtime stage also `apt-get install
# libsqlite3-0` so even if the bundled feature ever stops propagating
# (e.g., a future dep adds `default-features = false` and breaks the
# union), the runtime image still has the system lib.
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

# pkcs8 transitive-pin resolution (Phase 1 of #33; see comment block above).
# ciris-crypto v4.0.0 pulls ml-dsa = "=0.1.0-rc.8" which requires
# pkcs8 ^0.11.0-rc.11. Cargo's caret resolution for pre-release versions
# would otherwise pick pkcs8 0.11.0 stable (API-incompatible with ml-dsa rc.8).
# Declaring pkcs8 explicitly at the top level forces version unification to
# rc.11 across all transitive deps. Registry does NOT use pkcs8 directly;
# this is purely a resolver constraint to keep ciris-crypto + ml-dsa happy.
pkcs8 = "=0.11.0-rc.11"

# NOTE on BuildManifest validation:
# We do NOT pull ciris-verify-core. Reasons:
#   1. ciris-verify-core has a hard rusqlite dep (license cache) that
#      conflicts with sqlx-sqlite at the libsqlite3-sys linker level.
#   2. Most of ciris-verify-core (transparency log, license cache,
#      registry client, app_attest) is verifier-side and unused by the
#      registry.
#   3. The BuildManifest type is small (~80 lines) and stable enough to
#      vendor + maintain wire-format parity via integration tests.
# See `src/security/build_manifest.rs` for the vendored type. ciris-crypto
# (above) provides the actual signature verifiers we use.

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
# chrono carried because ciris-persist v3.3.0+ federation types use
# chrono::DateTime<Utc> (the v2.x → v3.x migration switched off `time`).
# Registry's own time handling stays on `time` crate; chrono is reserved
# for surfaces touching upstream Persist types directly.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.15"
dotenvy = "0.15"

# Authentication
jsonwebtoken = "9.3"
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"  # For generating test certificates

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Health checks
axum = "0.8"  # For HTTP/REST gateway

# Compression for offline packages
flate2 = "1.0"
zstd = "0.13"

# Merkle tree
rs_merkle = "1.4"

# Base encoding
hex = "0.4"
base64 = "0.22"

# CBOR for App Attest
ciborium = "0.2"

# X.509 certificate parsing for App Attest
x509-cert = "0.2"
der = "0.7"
p256 = { version = "0.13", features = ["ecdsa"] }
ring = "0.17"

# HTTP client (used by Play Integrity verifier)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
tempfile = "3.15"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# Property-based testing (Rust equivalent of Hypothesis)
proptest = "1.5"
proptest-derive = "0.5"

# Test utilities
test-case = "3.3"      # Parameterized tests
fake = { version = "3.1", features = ["derive"] }  # Fake data generation
chrono = "0.4"         # Time utilities for tests
pretty_assertions = "1.4"  # Better assertion diffs


# Profiles moved to workspace root Cargo.toml per Cargo's "profiles for
# the non-root package will be ignored" warning.
