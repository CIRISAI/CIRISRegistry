name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'rust-registry/**'
      - 'protocol/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Build the image with all tags EXCEPT :latest. Push to ghcr.io
      # under the SHA-pinned + branch + PR tags only — so even if the
      # binary is broken, watchtower won't see a new :latest and
      # auto-deploy a crash-looping image to prod. The :latest tag is
      # gated by the smoke test below.
      - name: Filter out :latest from tag list (gate :latest behind smoke test)
        id: tags_no_latest
        run: |
          # Output tags minus any line matching ":latest" — preserves
          # newline-separated multi-tag format the build-push-action expects.
          echo "tags<<TAGS_EOF" >> "$GITHUB_OUTPUT"
          echo "${{ steps.meta.outputs.tags }}" | grep -v ":latest$" >> "$GITHUB_OUTPUT"
          echo "TAGS_EOF" >> "$GITHUB_OUTPUT"

      - name: Build + push (without :latest)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags_no_latest.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CRITICAL — smoke test the built image BEFORE we tag it :latest.
      # v2.1.0 (commit 385fd07d) was pushed to :latest with a missing
      # libsqlite3.so.0 → both production regions crash-looped on
      # auto-deploy. This step exists so that can't happen again: if
      # the binary fails to dlopen its shared libs (or any other
      # fast-fail-at-load issue surfaces), the workflow fails BEFORE
      # the :latest tag promotion below.
      - name: Smoke test — verify binary loads (no missing shared libs)
        if: github.event_name != 'pull_request'
        run: |
          set -e
          SHA_TAG=$(echo "${{ steps.tags_no_latest.outputs.tags }}" | grep -E ":[0-9a-f]{7,}$" | head -1)
          if [ -z "$SHA_TAG" ]; then
            echo "ERROR: could not find SHA-pinned tag to smoke-test"
            echo "Tags emitted:"
            echo "${{ steps.tags_no_latest.outputs.tags }}"
            exit 1
          fi
          echo "Smoke-testing $SHA_TAG"
          docker pull "$SHA_TAG"
          # ldd-equivalent check: any missing shared lib?
          docker run --rm --entrypoint=/usr/bin/ldd "$SHA_TAG" /app/ciris-registry > /tmp/ldd.out 2>&1 || true
          echo "=== ldd output ==="
          cat /tmp/ldd.out
          if grep -q "not found" /tmp/ldd.out; then
            echo "ERROR: binary has unresolved shared libraries — refusing to promote to :latest"
            grep "not found" /tmp/ldd.out
            exit 1
          fi
          # Confirm binary starts to load — boot will fail downstream on
          # missing DB / env, but we want it to get past dlopen at minimum.
          # Capture first 5 lines of stderr; fail if we see the
          # libsqlite3 / loading-shared-libraries class of error.
          docker run --rm "$SHA_TAG" 2>&1 | head -5 > /tmp/boot.out || true
          echo "=== boot first lines ==="
          cat /tmp/boot.out
          if grep -qE "loading shared libraries|cannot open shared object" /tmp/boot.out; then
            echo "ERROR: binary fails to load shared libraries at startup — refusing to promote to :latest"
            exit 1
          fi
          echo "OK: binary loads cleanly"

      # Now that smoke passed, promote :latest by retagging the SHA image.
      - name: Promote :latest (after smoke passed)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          SHA_TAG=$(echo "${{ steps.tags_no_latest.outputs.tags }}" | grep -E ":[0-9a-f]{7,}$" | head -1)
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker tag "$SHA_TAG" "$LATEST_TAG"
          docker push "$LATEST_TAG"
          echo "Promoted $SHA_TAG to $LATEST_TAG"

      # =====================================================================
      # Sign + publish the registry's BuildManifest to the production
      # CIRISRegistry so federation peers can verify our binary integrity.
      # Implements the v1.8.0 self-manifest consumer role per CIRISVerify
      # umbrella issue #1; uses ciris-build-sign from the v1.8.0 build-tool
      # tarball and POSTs to /v1/verify/build-manifest.
      #
      # Requires GHA secrets set on this repo:
      #   - CIRIS_BUILD_ED25519_SECRET (base64 of 32-byte Ed25519 seed)
      #   - CIRIS_BUILD_MLDSA_SECRET   (base64 of 32-byte ML-DSA-65 seed)
      #   - REGISTRY_ADMIN_TOKEN
      # And vars.REGISTRY_URL set to https://api.registry.ciris-services-1.ai
      #
      # The signing seeds must match the production registry's steward
      # keys (boot-seeded into trusted_primitive_keys as project=
      # 'ciris-registry'). If they differ, verification will fail; the
      # operator must register the GHA-derived pubkey via
      # RegisterTrustedPrimitiveKey admin RPC.
      # =====================================================================

      - name: Sign + publish registry BuildManifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CIRIS_BUILD_ED25519_SECRET: ${{ secrets.CIRIS_BUILD_ED25519_SECRET }}
          CIRIS_BUILD_MLDSA_SECRET: ${{ secrets.CIRIS_BUILD_MLDSA_SECRET }}
          REGISTRY_ADMIN_TOKEN: ${{ secrets.REGISTRY_ADMIN_TOKEN }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          # Use the first tag emitted by metadata-action (already
          # lowercase-normalized by docker/metadata-action). Avoids the
          # "repository name must be lowercase" error from constructing
          # tags out of ${{ github.repository }} which retains case.
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          # Sanity-check secrets are populated and not the dash-byte trash
          # (gh secret set --body - bug — see CIRISBilling#5 thread).
          if [ -z "${CIRIS_BUILD_ED25519_SECRET:-}" ] \
             || [ -z "${CIRIS_BUILD_MLDSA_SECRET:-}" ] \
             || [ -z "${REGISTRY_ADMIN_TOKEN:-}" ]; then
            echo "ERROR: build-signing secrets are missing on this repo." >&2
            echo "  Set CIRIS_BUILD_ED25519_SECRET, CIRIS_BUILD_MLDSA_SECRET," >&2
            echo "  REGISTRY_ADMIN_TOKEN as repo secrets." >&2
            exit 1
          fi
          if [ "${#CIRIS_BUILD_ED25519_SECRET}" -lt 32 ] \
             || [ "${#CIRIS_BUILD_MLDSA_SECRET}" -lt 32 ]; then
            echo "ERROR: build-signing secrets are too short (got" \
              "ed25519=${#CIRIS_BUILD_ED25519_SECRET}, mldsa=${#CIRIS_BUILD_MLDSA_SECRET})." >&2
            echo "  Likely the gh-secret-set --body - bug. Re-upload using" \
              "--body \"\$(cat /path/to/seed.b64)\" or stdin without --body." >&2
            exit 1
          fi
          if [ -z "${REGISTRY_URL:-}" ]; then
            echo "ERROR: vars.REGISTRY_URL is not set on this repo." >&2
            exit 1
          fi

          # Download ciris-build-sign from the CIRISVerify v1.8.0 release.
          # The tarball is signed (.sig + .pem) — we trust GHA's TLS to
          # GitHub here; future hardening can verify the cosign signature.
          curl -sLfo /tmp/build-tool.tgz \
            https://github.com/CIRISAI/CIRISVerify/releases/download/v1.8.0/ciris-verify-v1.8.0-build-tool-linux-x86_64.tar.gz
          tar -xzf /tmp/build-tool.tgz -C /tmp/
          chmod +x /tmp/build-tool/ciris-build-sign

          # Materialize raw 32-byte seeds from base64 GHA secrets.
          # Use printf to avoid the trailing-newline issue echo introduces.
          printf '%s' "$CIRIS_BUILD_ED25519_SECRET" | base64 -d > /tmp/ed25519.seed
          printf '%s' "$CIRIS_BUILD_MLDSA_SECRET"   | base64 -d > /tmp/mldsa65.secret
          chmod 0400 /tmp/ed25519.seed /tmp/mldsa65.secret

          # Verify seed lengths after decode — catches base64-of-dash etc.
          ED_LEN=$(stat -c '%s' /tmp/ed25519.seed)
          ML_LEN=$(stat -c '%s' /tmp/mldsa65.secret)
          if [ "$ED_LEN" -ne 32 ] || [ "$ML_LEN" -ne 32 ]; then
            echo "ERROR: decoded seed lengths wrong (ed25519=$ED_LEN, mldsa=$ML_LEN, expected 32 each)" >&2
            exit 1
          fi

          # Compute the Ed25519 pubkey fingerprint that this seed will sign
          # with — diagnostic for when verification fails registry-side.
          # The fingerprint must match what's registered as the trusted key
          # for project='ciris-registry' in the production registry.
          python3 -c '
          import hashlib, base64
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          seed = open("/tmp/ed25519.seed", "rb").read()
          pk = Ed25519PrivateKey.from_private_bytes(seed).public_key()
          pub = pk.public_bytes(Encoding.Raw, PublicFormat.Raw)
          print("Build-signing Ed25519 pubkey:")
          print(f"  fingerprint (sha256 hex): {hashlib.sha256(pub).hexdigest()}")
          print(f"  pubkey (base64):          {base64.b64encode(pub).decode()}")
          print("If verification fails registry-side, this fingerprint must")
          print("match the trusted key registered for project=\"ciris-registry\".")
          print("Compare with output of ListTrustedPrimitiveKeys admin RPC.")
          ' || echo "(python ed25519 pubkey derivation unavailable; cryptography lib not installed)"

          # Pick one of the metadata-action tags (use the first, which is
          # the branch tag — guaranteed to exist post-push). Pull it down
          # so we can extract the binary.
          IMAGE_TAG=$(echo "$META_TAGS" | head -n1)
          echo "Pulling image: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"

          CONTAINER_ID=$(docker create "$IMAGE_TAG")
          docker cp "$CONTAINER_ID":/app/ciris-registry /tmp/ciris-registry
          docker rm "$CONTAINER_ID" >/dev/null

          # Determine binary version from Cargo.toml.
          BINARY_VERSION=$(awk -F'"' '/^version/ {print $2; exit}' rust-registry/Cargo.toml)
          BUILD_ID="$GITHUB_SHA"

          echo "Signing BuildManifest:"
          echo "  primitive:        registry"
          echo "  build_id:         $BUILD_ID"
          echo "  target:           x86_64-unknown-linux-gnu"
          echo "  binary_version:   $BINARY_VERSION"
          echo "  binary path:      /tmp/ciris-registry"
          echo "  binary size:      $(stat -c '%s' /tmp/ciris-registry) bytes"
          echo "  binary sha256:    $(sha256sum /tmp/ciris-registry | cut -d' ' -f1)"

          /tmp/build-tool/ciris-build-sign sign \
            --primitive registry \
            --build-id "$BUILD_ID" \
            --target x86_64-unknown-linux-gnu \
            --binary /tmp/ciris-registry \
            --binary-version "$BINARY_VERSION" \
            --ed25519-seed /tmp/ed25519.seed \
            --mldsa-secret /tmp/mldsa65.secret \
            --key-id "ciris-registry-steward" \
            --output /tmp/build-manifest.json

          echo "Signed manifest:"
          jq '. | del(.signature.classical, .signature.pqc)' /tmp/build-manifest.json || cat /tmp/build-manifest.json

          # POST to the production registry. The 5x-with-2x-success
          # retry pattern handles transient watchtower-restart 502s.
          set +e
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sS -o /tmp/publish-response.json -w '%{http_code}' \
              -X POST "${REGISTRY_URL}/v1/verify/build-manifest" \
              -H "Authorization: Bearer ${REGISTRY_ADMIN_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/build-manifest.json)
            echo "Attempt $attempt: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "Publish succeeded:"
              jq . /tmp/publish-response.json || cat /tmp/publish-response.json
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Response body:"
              jq . /tmp/publish-response.json 2>/dev/null || cat /tmp/publish-response.json
              echo "Retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            else
              echo "ERROR: publish failed after 5 attempts. Final response:" >&2
              cat /tmp/publish-response.json >&2
              # If the failure is verification_failed for Ed25519, give a
              # clear next-action message — most common cause is GHA
              # build-signing pubkey doesn't match the trusted key
              # registered for project=ciris-registry.
              if grep -q "verification_failed.*Ed25519" /tmp/publish-response.json; then
                echo "" >&2
                echo "  This is the GHA build-signing pubkey vs trusted-key mismatch case." >&2
                echo "  See the 'Build-signing Ed25519 pubkey' line above for the fingerprint" >&2
                echo "  this seed produces. Two recovery paths:" >&2
                echo "" >&2
                echo "  (a) Swap the GHA secret CIRIS_BUILD_ED25519_SECRET (and MLDSA) to" >&2
                echo "      match the production steward seeds at /etc/ciris-registry/" >&2
                echo "      *.seed on the bridge nodes." >&2
                echo "" >&2
                echo "  (b) Register the GHA-derived pubkey via the admin RPC:" >&2
                echo "      grpcurl -d '{...with the pubkey shown above...}' \\\\" >&2
                echo "        api.registry.ciris-services-1.ai:443 \\\\" >&2
                echo "        ciris.registry.v1.RegistryAdminService/RegisterTrustedPrimitiveKey" >&2
              fi
              # Wipe seeds before exiting on failure
              shred -u /tmp/ed25519.seed /tmp/mldsa65.secret 2>/dev/null \
                || rm -f /tmp/ed25519.seed /tmp/mldsa65.secret
              exit 1
            fi
          done
          set -e

          # Wipe seed files from the runner.
          shred -u /tmp/ed25519.seed /tmp/mldsa65.secret 2>/dev/null \
            || rm -f /tmp/ed25519.seed /tmp/mldsa65.secret

          # Round-trip verify: the registry should serve back what we just
          # uploaded under project=ciris-registry.
          GET_URL="${REGISTRY_URL}/v1/verify/function-manifest/${BINARY_VERSION}/x86_64-unknown-linux-gnu?project=ciris-registry"
          echo "Round-trip verify: GET $GET_URL"
          curl -sS "$GET_URL" | jq '.binary_hash // .' || true
