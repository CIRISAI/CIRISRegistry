services:
  postgres:
    image: postgres:15-alpine
    container_name: ciris-postgres
    environment:
      POSTGRES_USER: ciris
      POSTGRES_PASSWORD: ciris_dev
      POSTGRES_DB: ciris_registry
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciris -d ciris_registry"]
      interval: 5s
      timeout: 5s
      retries: 5

  registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ciris-registry
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ciris
      DB_PASSWORD: ciris_dev
      DB_NAME: ciris_registry
      DB_SSLMODE: disable
      GRPC_PORT: 50051
      HTTP_PORT: 8080
      ENVIRONMENT: development
      RUST_LOG: info,ciris_registry=debug
    ports:
      - "50052:50051"  # gRPC API
      - "8082:8080"    # HTTP health/metrics
    restart: unless-stopped

volumes:
  postgres_data:
